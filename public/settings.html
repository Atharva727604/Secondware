<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#004a7c">
    <title>SecondWare | Settings</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile-fixes.css">
    <style>
        :root {
            --primary-teal: #008080;
            --dark-teal: #004a7c;
            --accent-orange: #ff6b6b;
            --bg-light: #f4f7f6;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .settings-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .settings-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .settings-card h2 {
            color: var(--dark-teal);
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 700;
        }

        .settings-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .settings-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 18px 25px;
            border-radius: 15px;
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #eee;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        .settings-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
            border-color: var(--primary-teal);
            color: var(--primary-teal);
        }

        .settings-btn .icon-circle {
            width: 45px;
            height: 45px;
            background: #f0f7f7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-right: 15px;
            transition: background 0.3s;
        }

        .settings-btn:hover .icon-circle {
            background: var(--primary-teal);
            color: white;
        }

        .btn-text {
            flex: 1;
            text-align: left;
        }

        .arrow {
            font-size: 1.2rem;
            opacity: 0.5;
        }

        .settings-btn:hover .arrow {
            opacity: 1;
        }

        .back-link {
            margin-top: 30px;
            display: inline-block;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--dark-teal);
        }

        /* Modal Styles for Change Email */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s;
        }

        .modal[hidden] {
            display: none;
            opacity: 0;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            position: relative;
            background: white;
            padding: 35px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            z-index: 1001;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .auth-input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--dark-teal);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .auth-btn:hover {
            background: #00365c;
        }

        @media (max-width: 480px) {
            .settings-card {
                padding: 30px 20px;
            }

            .settings-card h2 {
                font-size: 1.5rem;
            }

            .settings-btn {
                padding: 15px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">Second<span>Ware</span></a>

    <div class="header-actions">
      <button class="icon-btn" id="wishlist-toggle" aria-label="Wishlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.5s-7.5-4.6-9.8-9C.6 8 1.6 4.7 4.6 3.7c2-.7 4 0 5.4 1.8 1.4-1.8 3.4-2.5 5.4-1.8 3 1 4 4.3 2.4 7.8-2.3 4.4-9.8 9-9.8 9Z"/></svg>
        <span id="wishlist-count" class="cart-badge">0</span>
      </button>
      <button class="icon-btn" id="cart-toggle" aria-label="Shopping Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20.5 8H6"/><circle cx="9.5" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>
        <span id="cart-count" class="cart-badge">0</span>
      </button>
      <a href="login.html" id="auth-link" class="btn btn-outline">Log in</a>
    </div>
  </div>
</header>

    <main class="settings-container">
        <div class="settings-card">
            <h2>Account Settings</h2>

            <div class="settings-menu">
                <a href="#" class="settings-btn" onclick="openEmailModal(event)">
                    <div class="icon-circle">✉️</div>
                    <span class="btn-text">Change Email</span>
                    <span class="arrow">→</span>
                </a>

                <a href="login.html?action=forgot" class="settings-btn">
                    <div class="icon-circle">🔒</div>
                    <span class="btn-text">Change Password</span>
                    <span class="arrow">→</span>
                </a>
            </div>

            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </main>

    <!-- Change Email Modal -->
    <div id="email-modal" class="modal" hidden>
        <div class="modal-overlay" id="email-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="email-close" aria-label="Close">✕</button>
            <h2 style="text-align: center; margin-bottom: 20px; color: var(--dark-teal);">Change Email</h2>
            <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 0.9rem;">
                Enter your new email address. You will need to verify it.
            </p>

            <label for="new-email" style="font-size: 0.9rem; font-weight: 600; color: #444;">New Email Address</label>
            <input type="email" id="new-email" class="auth-input" placeholder="example@email.com">

            <button id="update-email-btn" class="auth-btn" onclick="handleUpdateEmail()">Update Email</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Side-panel toggle logic
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const sidePanel = document.getElementById('side-panel');
        const sideOverlay = document.getElementById('side-overlay');
        const sideClose = document.getElementById('side-close');

        function openSidePanel() {
            sidePanel.classList.add('active');
            sideOverlay.classList.add('active');
            sideOverlay.removeAttribute('hidden');
        }

        function closeSidePanel() {
            sidePanel.classList.remove('active');
            sideOverlay.classList.remove('active');
            sideOverlay.setAttribute('hidden', '');
        }

        if (hamburgerBtn) hamburgerBtn.addEventListener('click', openSidePanel);
        if (sideOverlay) sideOverlay.addEventListener('click', closeSidePanel);
        if (sideClose) sideClose.addEventListener('click', closeSidePanel);

        // Modal Logic
        const emailModal = document.getElementById('email-modal');
        const emailOverlay = document.getElementById('email-overlay');
        const emailClose = document.getElementById('email-close');

        function openEmailModal(e) {
            if (e) e.preventDefault();
            const token = getAuthToken();
            if (!token) {
                alert('Please login first to change your email.');
                window.location.href = 'login.html?from=settings.html';
                return;
            }
            emailModal.removeAttribute('hidden');
        }

        function closeEmailModal() {
            emailModal.setAttribute('hidden', '');
        }

        if (emailClose) emailClose.addEventListener('click', closeEmailModal);
        if (emailOverlay) emailOverlay.addEventListener('click', closeEmailModal);

        async function handleUpdateEmail() {
            const newEmail = document.getElementById('new-email').value.trim();
            if (!newEmail || !newEmail.includes('@')) {
                alert('Please enter a valid email address.');
                return;
            }

            const btn = document.getElementById('update-email-btn');
            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const token = getAuthToken();
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'update-email',
                        new_email: newEmail
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('Verification link sent to your new email. Please verify it to complete the change.');
                    closeEmailModal();
                } else {
                    alert('Error: ' + (data.error || 'Failed to update email'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Update Email';
            }
        }

        // Check if user is logged in
        document.addEventListener('DOMContentLoaded', () => {
            const token = getAuthToken();

            if (!token) {
                alert('Access denied. Please login to access settings.');
                window.location.href = 'login.html?from=settings.html';
                return;
            }

            initializeAdminVisibility();
        });
    </script>
    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/chatbot.js" type="module"></script>
    <script src="js/cookie-consent.js"></script>
</body>

</html>
